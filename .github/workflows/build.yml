name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ranger les fichiers dans les bons dossiers
        run: |
          set -e
          D=app/src/main
          P=$D/java/com/tony/mailtraducteur
          mkdir -p $P $D/res/layout $D/res/drawable $D/res/values
          mv -f *.kt $P/
          mv -f AndroidManifest.xml $D/
          mv -f activity_main.xml $D/res/layout/
          mv -f ic_launcher.xml ic_notif.xml $D/res/drawable/

          cat > $D/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Mail Traducteur</string>
          </resources>
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MailTraducteur"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.tony.mailtraducteur"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.tony.mailtraducteur"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.mlkit:translate:17.0.3")
              implementation("com.google.mlkit:language-id:17.0.6")
          }
          EOF

          find app -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MailTraducteur-apk
          path: app/build/outputs/apk/debug/app-debug.apk
